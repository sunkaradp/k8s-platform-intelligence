apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformhealthchecks.platformintel.example.com
spec:
  group: platformintel.example.com
  names:
    kind: PlatformHealthCheck
    plural: platformhealthchecks
    singular: platformhealthcheck
    shortNames: [phc]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                windowMinutes: { type: integer }
                stepSeconds: { type: integer }
                warnHours: { type: number }
                thresholdAvailableRatio: { type: number }

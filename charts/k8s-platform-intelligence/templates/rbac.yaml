apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-intelligence
  namespace: platform-intelligence
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-intelligence
  namespace: platform-intelligence
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["platformintel.example.com"]
    resources: ["platformhealthchecks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-intelligence
  namespace: platform-intelligence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-intelligence
subjects:
  - kind: ServiceAccount
    name: platform-intelligence
    namespace: platform-intelligence

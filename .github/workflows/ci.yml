name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: operator/requirements.txt
      - name: Install operator dependencies
        run: pip install -r operator/requirements.txt
      - name: Run prediction logic tests
        working-directory: operator
        run: python -m unittest discover -s tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check Go formatting
        working-directory: tools/node-memory-check
        run: test -z "$(gofmt -l .)"
      - name: Test Go Prometheus helper
        working-directory: tools/node-memory-check
        run: |
          go vet ./...
          go test -race ./...

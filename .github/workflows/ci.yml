name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: operator/requirements.txt
      - name: Install operator dependencies
        run: pip install -r operator/requirements.txt
      - name: Run prediction logic tests
        working-directory: operator
        run: python -m unittest discover -s tests -v
